<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#17120e" />
<title>径山寺 · 线上礼佛</title>
<link rel="stylesheet" href="./styles/main.css" />
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>

<div class="hud">
  <div class="brand">
    <div class="seal">徑山</div>
    <div>
      <div class="brand-name">径山寺 · 线上礼佛</div>
      <div class="brand-sub" id="zoneSub">五进中轴 · 庭院</div>
    </div>
  </div>
  <div class="minimap">
    <canvas id="minimapCanvas" width="340" height="600"></canvas>
  </div>
</div>

<div class="hint" id="hint">
  <b>W A S D</b> 行走 · <b>Shift</b> 快走<br />
  <b>鼠标</b> 环绕小人 · <b>E</b> 互动 · <b>空格</b> 合十拜拜
</div>

<div class="zone" id="zone"><strong>径山寺</strong><small>五进中轴 · 庭院</small></div>
<div id="prompt" class="prompt"></div>
<div id="toast" class="toast"></div>

<div id="stick" class="stick"><div id="knob" class="knob"></div></div>
<button id="bowBtn" class="bow-btn">拜拜</button>
<button id="actBtn" class="act-btn">互动</button>

<div id="fade" class="fade"></div>

<div id="start" class="overlay">
  <div class="start-card">
    <div class="start-eyebrow">JINGSHAN TEMPLE</div>
    <div class="start-title">径山寺</div>
    <div class="start-sub">南来径山 · 一径通天</div>
    <div class="start-line"></div>
    <div class="start-desc">
      沿五进中轴拾阶而上，五凤山门、释迦宝殿、潮音堂，直至凌霄阁。<br />
      行至殿前按 E 入殿；走到蒲团前按 E 跪拜，按空格合十拜拜；也可站定后按空格合十。
    </div>
    <button id="enter" class="enter">入 山</button>
    <div class="start-note" id="startNote">点击后拖动鼠标环绕视角，按 Esc 释放鼠标</div>
  </div>
</div>

<div id="nogl" class="overlay hidden">
  <div class="start-card">
    <div class="start-title" style="font-size:32px;letter-spacing:6px;">无法开启山门</div>
    <div class="start-desc">当前浏览器不支持 WebGL，请更换浏览器或开启硬件加速。</div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (window.__JINGSHAN__) return;
      document.getElementById('start').classList.add('hidden');
      const nogl = document.getElementById('nogl');
      nogl.querySelector('.start-title').textContent = '请通过 HTTP 打开';
      nogl.querySelector('.start-desc').textContent =
        '浏览器不允许 file:// 加载模块。请在当前目录运行 python3 -m http.server 8000，再访问 http://localhost:8000/。';
      nogl.classList.remove('hidden');
    }, 2500);
  });
</script>
</body>
</html>
